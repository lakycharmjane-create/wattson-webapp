<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Повторение формул</title>
  <!-- Библиотека Telegram: даёт объект window.Telegram.WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <!-- Экран 1: выбор формул (если приложение открыли без выбора из бота) -->
  <section id="picker" class="screen hidden">
    <header class="topbar"><div class="brand">🧠 Повторение формул</div></header>
    <div class="tabs" id="tabs">
      <button data-tab="f" class="on">Формулы</button>
      <button data-tab="d">Вывод формул</button>
    </div>
    <div class="units">
      <p class="legend" id="pickHint"></p>
      <div id="topics"></div>
    </div>
    <footer class="footer" id="pickFooter"><button id="startBtn" class="btn" disabled>Выбери формулы</button></footer>
  </section>

  <!-- Экран 2: повторение -->
  <section id="lesson" class="screen hidden">
    <header class="lessonbar">
      <button class="x" id="quit" aria-label="Выйти">✕</button>
      <div class="progress"><div id="progFill"></div></div>
    </header>
    <main id="exercise" class="exercise"></main>
    <footer id="footer" class="footer">
      <div id="feedback" class="feedback"></div>
      <button id="action" class="btn" disabled>Проверить</button>
    </footer>
  </section>

  <!-- Экран 3: итог -->
  <section id="done" class="screen hidden">
    <div class="donebox">
      <img src="cat.png" alt="" class="cat">
      <h1 id="doneTitle">Повторение окончено</h1>
      <div class="cards">
        <div class="statcard xp"><small>ФОРМУЛ</small><b id="doneCount">0</b></div>
        <div class="statcard acc"><small>ТОЧНОСТЬ</small><b id="doneAcc">100%</b></div>
      </div>
      <div id="doneBad" class="donebad"></div>
    </div>
    <footer class="footer donebtns">
      <button id="againBad" class="btn red">Повторить ошибки</button>
      <button id="againAll" class="btn">Ещё раз всё</button>
      <button id="toPicker" class="btn ghostbtn">Выбрать другие формулы</button>
    </footer>
  </section>

  <script src="formulas.js?v=13"></script>
  <script src="derivations.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>

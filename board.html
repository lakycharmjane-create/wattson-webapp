<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Решаем вместе</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: var(--tg-theme-bg-color, #fff); --text: var(--tg-theme-text-color, #3c3c3c); --muted: var(--tg-theme-hint-color, #8a8a8a);
            --line: rgba(128,128,128,.28); --blue: #1cb0f6; --green: #58cc02; --red: #ff4b4b; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
                 font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 2px solid var(--line); }
    .bar b { font-size: 16px; color: #ff9600; flex: 1; }
    .pill { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 20px; background: rgba(128,128,128,.15); color: var(--muted); white-space: nowrap; }
    .pill.on { background: rgba(88,204,2,.18); color: #46a302; }
    .btn { border: 2px solid var(--line); background: none; color: var(--text); border-radius: 12px; padding: 7px 12px; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; }
    .btn.blue { border-color: var(--blue); color: var(--blue); background: rgba(28,176,246,.12); }
    .task { padding: 6px 12px; border-bottom: 2px solid var(--line); }
    .task textarea { width: 100%; min-height: 44px; max-height: 120px; resize: vertical; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px;
                     font: inherit; font-size: 15px; background: var(--bg); color: var(--text); }
    .task small { color: var(--muted); font-weight: 700; font-size: 12px; }
    #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; background: rgba(128,128,128,.12); }
    #wrap { position: relative; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.18); touch-action: none; }
    #cv { display: block; width: 100%; height: 100%; border-radius: 10px; touch-action: none; }
    .cur { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #ff4b4b; border: 2px solid #fff;
           box-shadow: 0 1px 4px rgba(0,0,0,.4); pointer-events: none; transition: left .06s linear, top .06s linear; }
    .cur i { position: absolute; left: 14px; top: -4px; font: 700 11px/1 system-ui; font-style: normal; background: #ff4b4b; color: #fff; padding: 2px 5px; border-radius: 6px; white-space: nowrap; }
    .tools { display: flex; align-items: center; gap: 6px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 2px solid var(--line); overflow-x: auto; }
    .sw { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
    .sw.on { box-shadow: 0 0 0 3px var(--blue); }
    .tool { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--line); background: none; font-size: 19px; cursor: pointer; color: var(--text); }
    .tool.on { border-color: var(--blue); background: rgba(28,176,246,.14); }
    .sep { flex: none; width: 2px; height: 26px; background: var(--line); }
    #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; background: var(--bg); z-index: 9; font-weight: 700; line-height: 1.5; }
    #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: .95; }
  </style>
</head>
<body>
  <div class="bar">
    <b>👥 Вместе</b>
    <span class="pill" id="peers">…</span>
    <button class="btn blue" id="invite">Позвать друга</button>
  </div>
  <div class="task"><textarea id="task" placeholder="Условие задачи (видит и друг). Впиши или вставь текст — а решение рисуйте на доске."></textarea></div>
  <div id="stage"><div id="wrap"><canvas id="cv"></canvas></div></div>
  <div class="tools" id="tools">
    <span class="sw on" data-c="#222222" style="background:#222"></span>
    <span class="sw" data-c="#e53935" style="background:#e53935"></span>
    <span class="sw" data-c="#1e88e5" style="background:#1e88e5"></span>
    <span class="sw" data-c="#43a047" style="background:#43a047"></span>
    <span class="sep"></span>
    <button class="tool on" data-w="4" title="Тонкая">✏️</button>
    <button class="tool" data-w="10" title="Толстая">🖊️</button>
    <button class="tool" data-w="28" id="eraser" title="Ластик">🧽</button>
    <span class="sep"></span>
    <button class="tool" id="undo" title="Отменить мой последний штрих">↩️</button>
    <button class="tool" id="clear" title="Очистить доску">🗑️</button>
  </div>
  <div id="msg"></div>
  <div id="toast"></div>
  <script src="board.js?v=1"></script>
</body>
</html>
